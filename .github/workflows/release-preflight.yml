name: release-preflight

on:
  pull_request:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'just/**'
      - '.agents/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-preflight-ubuntu-stable

      - name: Install just
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # just
        with:
          tool: just

      - name: Release readiness gate
        run: just release-check
